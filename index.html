<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dotted.</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    </head>
<body>
    <div id="container">
        
        <aside id="sidebar">
            <h2>dotted.</h2>
            <div class="setting-group">
                <label for="dotSize">Dot Size:</label>
                <input type="range" id="dotSize" min="5" max="50" value="25">
                <span id="dotSizeValue">25px</span>
            </div>
            <div class="setting-group">
                <label for="dotColor">Dot Color:</label>
                <input type="color" id="dotColor" value="#ffffff">
            </div>
            <div class="setting-group">
                <label for="followSpeed">Follow Speed:</label>
                <input type="range" id="followSpeed" min="0.05" max="0.5" step="0.01" value="0.1">
                <span id="followSpeedValue">0.1</span>
            </div>
            <div class="setting-group">
                <label for="numDots">Number of Dots:</label>
                <input type="range" id="numDots" min="1" max="100" value="25">
                <span id="numDotsValue">25</span>
            </div>
            <div class="setting-group">
                <button id="snapshot-btn" class="snapshot-button">📷 Capture Screen</button>
            </div>
            
            <div class="setting-group">
                <button id="cameraToggleButton" class="circular-button">👁️ Camera Mode</button>
            </div>
            <div class="setting-group">
                <label for="backgroundImageUpload">Upload Background:</label>
                <input type="file" id="backgroundImageUpload" accept="image/*">
            </div>
             <div class="setting-group">
                <label for="slideshowToggle">
                <input type="checkbox" id="slideshowToggle" checked> 
                Enable Background Slideshow
                </label>
            </div>
            <div class="setting-group">
                <label for="defaultBackgrounds">Default Backgrounds:</label>
                <select id="defaultBackgrounds">
                    <option value="" disabled selected>Select a Background...</option>
                    <option value="fall.JPG">BG 1 - Fall</option>
                    <option value="cat.JPG">BG 2 - Cat</option>
                    <option value="beach.jpeg">BG 3 - Beach</option>
                    <option value="houses.jpg">BG 4 - Houses</option>
                    <option value="kusama.JPG">BG 5 - kusama</option>
                    <option value="museum.jpeg">BG 6 - museum</option>
                    <option value="park.JPG">BG 7 - park</option>
                    <option value="sashimi.JPG">BG 8 - sashimi</option>
                    <option value="studio.JPG">BG 9 - studio</option>
                    <option value="trees.JPG">BG 10 - trees</option>
                    <option value="water.JPG">BG 11 - water</option>
                </select>
            </div>
        </aside>

        <main id="main-content">
            <video id="webcamFeed" style="display: none;" autoplay playsinline></video>
            
            <svg id="dot-connections-svg" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"></svg>
        </main>
            
    </div>

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <script src="script.js"></script>
    
</body>
</html>
