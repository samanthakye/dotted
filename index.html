<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dotted.</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose"></script>
</head>
<body>
    <div id="container">
        <div id="content-wrapper">
            <aside id="sidebar">
                <h2>dotted.</h2>
                <div class="setting-group">
                    <label for="dotSize">Dot Size:</label>
                    <input type="range" id="dotSize" min="5" max="50" value="25">
                    <span id="dotSizeValue">25px</span>
                </div>
                <div class="setting-group">
                    <label for="numDots">Number of Dots:</label>
                    <input type="range" id="numDots" min="1" max="100" value="25">
                    <span id="numDotsValue">25</span>
                </div>
                <div class="setting-group">
                    <label for="followSpeed">Follow Speed:</label>
                    <input type="range" id="followSpeed" min="0.05" max="0.5" step="0.01" value="0.1">
                    <span id="followSpeedValue">0.1</span>
                </div>
                <div class="setting-group">
                    <button id="snapshot-btn" class="snapshot-button">📷 Capture Screen</button>
                </div>
                <div class="setting-group">
                    <button id="fullscreen-btn" class="snapshot-button">↔️ Fullscreen</button>
                </div>
                <div class="setting-group">
                    <button id="interactiveModeButton" class="circular-button">👁️ Camera & 🎤 Audio Mode</button>
                </div>
            </aside>

            <main id="main-content">
                <video id="webcamFeed" autoplay playsinline></video>
                <canvas id="handCanvas" style="position: absolute; top: 0; left: 0; z-index: 11;"></canvas>
            </main>
        </div>
        <button id="sidebar-arrow-btn">&larr;</button>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
