<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dotted.</title>
    
    <!-- DM Sans Font Import -->
    <link href="[https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap](https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap)" rel="stylesheet">
    
    <!-- Custom Tailwind Configuration (Must be before loading Tailwind CDN) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'neon': '#DFFF00', // Playful, bright accent color
                        'surface-light': '#fefefe', // Subtle off-white background
                    },
                    boxShadow: {
                        'soft': '0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.03)',
                        'card': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                    },
                    fontFamily: {
                        // Setting 'DM Sans' as the default sans-serif font
                        sans: ['DM Sans', 'sans-serif'], 
                    }
                }
            }
        }
    </script>
    
    <!-- Tailwind CSS CDN -->
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <!-- Custom CSS styles would go here -->
    
</head>
<body class="bg-surface-light overflow-hidden font-sans text-gray-800" id="body-main">

    <!-- Background Layer (Cycles Images) -->
    <div id="background-container"></div>

    <!-- Main Application Content -->
    <div id="canvas" class="relative w-full h-screen z-10">
        <!-- Message Box (Floating card style) -->
        <div id="message-box" class="fixed top-5 left-1/2 transform -translate-x-1/2 p-3 bg-gray-900 text-white rounded-xl shadow-soft opacity-0 transition-opacity duration-300 z-[500] font-semibold"></div>
    </div>

    <!-- Settings Sidebar (Left-aligned, card style) -->
    <div id="settings" class="fixed top-0 left-0 h-full w-full sm:w-80 bg-white p-6 overflow-y-auto text-gray-800 shadow-card transition-transform duration-300 transform -translate-x-full sm:translate-x-0 rounded-r-2xl">

        <h2 class="text-3xl font-extrabold mb-6 text-gray-900 border-b border-gray-100 pb-2">Trail Customizer</h2>

        <!-- Dot Size -->
        <div class="mb-6 p-4 rounded-xl bg-gray-50 shadow-soft">
            <label for="dot-size" class="block text-sm font-medium mb-2">Dot Size: <span id="size-value" class="font-bold">12px</span></label>
            <input type="range" id="dot-size" min="4" max="30" value="12" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-neon">
        </div>

        <!-- Dot Color -->
        <div class="mb-6 p-4 rounded-xl bg-gray-50 shadow-soft">
            <label for="dot-color" class="block text-sm font-medium mb-2">Dot Color:</label>
            <div class="flex items-center space-x-3">
                <input type="color" id="dot-color" value="#000000" class="w-10 h-10 p-1 border border-gray-300 rounded-full cursor-pointer bg-transparent shadow-sm">
                <span class="text-xs text-gray-500">The primary color of the trailing dots.</span>
            </div>
        </div>

        <!-- Following Speed (Interpolation Factor) -->
        <div class="mb-6 p-4 rounded-xl bg-gray-50 shadow-soft">
            <label for="dot-speed" class="block text-sm font-medium mb-2">Follow Speed: <span id="speed-value" class="font-bold">0.15</span> (Slower to Faster)</label>
            <input type="range" id="dot-speed" min="5" max="40" value="15" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-neon">
        </div>

        <!-- Interaction Tip Card -->
        <p class="text-gray-900 text-sm italic mt-8 p-4 bg-neon bg-opacity-80 rounded-2xl font-medium shadow-soft">
            <span class="font-bold">Interaction Tip:</span> Double-click anywhere on the screen to scatter the dots.
        </p>

        <!-- Background Image Uploader -->
        <div class="mt-8 pt-6 border-t border-gray-200">
            <h3 class="text-xl font-semibold mb-4 text-gray-700">Background Setup</h3>
            <p class="text-sm mb-4 text-gray-600">Upload your own image or URL to override the rotating background.</p>

            <label for="image-upload" class="cursor-pointer inline-block bg-gray-900 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-xl transition duration-200 shadow-md hover:shadow-lg">
                Upload Custom Background
                <input type="file" id="image-upload" accept="image/*" class="hidden">
            </label>
        </div>

        <!-- Instructions for the background rotation -->
        <div class="mt-8 pt-6 border-t border-gray-200">
            <h3 class="text-xl font-semibold mb-4 text-gray-700">Background Rotation</h3>
            <button id="toggle-rotation" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-xl transition duration-200 shadow-md hover:shadow-lg">
                Pause Rotation
            </button>
        </div>

    </div>

    <!-- JavaScript Logic would go here -->
</body>
